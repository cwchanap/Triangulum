name: Build and Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          BUILD_DESTINATION="generic/platform=iOS"
          if command -v xcpretty >/dev/null 2>&1; then
            set +e
            xcodebuild -project Triangulum.xcodeproj -scheme Triangulum -configuration Debug -destination "$BUILD_DESTINATION" CODE_SIGNING_ALLOWED=NO build | xcpretty
            PIPE_RESULTS=("${PIPESTATUS[@]}")
            BUILD_RESULT=${PIPE_RESULTS[0]}
            FORMATTER_RESULT=${PIPE_RESULTS[1]}
            set -e
            if [ $BUILD_RESULT -eq 0 ] && [ "$FORMATTER_RESULT" -ne 0 ] 2>/dev/null; then
              echo "::warning::xcpretty exited with code $FORMATTER_RESULT"
            fi
            if [ $BUILD_RESULT -ne 0 ]; then
              exit $BUILD_RESULT
            fi
          else
            echo "xcpretty not found; using raw xcodebuild output"
            xcodebuild -project Triangulum.xcodeproj -scheme Triangulum -configuration Debug -destination "$BUILD_DESTINATION" CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint